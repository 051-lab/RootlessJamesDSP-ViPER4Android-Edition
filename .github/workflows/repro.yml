name: Repro crash in emulator
on: workflow_dispatch

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt
      - name: Build x86_64 debug APK
        run: ./gradlew assembleRootlessFdroidDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app with exciter enabled, capture crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            PKG=me.timschneeberger.rootlessjamesdsp.debug
            adb install -r app/build/outputs/apk/rootlessFdroid/debug/*x86_64*.apk
            adb shell am start -n $PKG/me.timschneeberger.rootlessjamesdsp.activity.MainActivity || true
            sleep 15
            printf '<?xml version="1.0" encoding="utf-8" standalone="yes" ?>\n<map>\n<boolean name="bassex_enable" value="true" />\n</map>\n' > /tmp/bassex.xml
            printf '<?xml version="1.0" encoding="utf-8" standalone="yes" ?>\n<map>\n<boolean name="first_boot" value="false" />\n</map>\n' > /tmp/var.xml
            adb shell "run-as $PKG mkdir -p shared_prefs" || true
            adb shell "run-as $PKG sh -c 'cat > shared_prefs/dsp_bassex.xml'" < /tmp/bassex.xml
            adb shell "run-as $PKG sh -c 'cat > shared_prefs/variable.xml'" < /tmp/var.xml
            adb shell am force-stop $PKG
            adb logcat -c || true
            adb shell am start -n $PKG/me.timschneeberger.rootlessjamesdsp.activity.MainActivity || true
            sleep 20
            adb logcat -d > logcat-main.txt || true
            adb logcat -d -b crash > logcat-crash.txt || true
            tail -50 logcat-crash.txt || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-logs
          path: logcat-*.txt
