name: LiveProg feature CI

on:
  push:
    branches:
      - feature/liveprog-slider-block
      - debug/liveprog-x86_64-forensics
  workflow_dispatch:

concurrency:
  group: liveprog-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build rootless F-Droid debug APK
        run: ./gradlew assembleRootlessFdroidDebug --no-daemon

      - name: Compile rootless F-Droid instrumentation APK
        run: ./gradlew assembleRootlessFdroidDebugAndroidTest --no-daemon

      - name: JVM tests
        run: ./gradlew testRootlessFdroidDebugUnitTest --no-daemon

      - name: Build rootless F-Droid release APK
        run: ./gradlew assembleRootlessFdroidRelease --no-daemon

  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Isolate LiveProg slot access crash on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb logcat -c || true
            adb shell getprop ro.product.cpu.abi > emulator-props.txt || true
            adb shell getprop ro.build.version.sdk >> emulator-props.txt || true
            adb shell getprop ro.build.version.release >> emulator-props.txt || true
            adb logcat -v threadtime > liveprog-logcat.txt 2>&1 &
            logcat_pid=$!
            set +e
            ./gradlew connectedRootlessFdroidDebugAndroidTest --no-daemon --stacktrace --info '-Pandroid.testInstrumentationRunnerArguments.class=me.timschneeberger.rootlessjamesdsp.interop.LiveProgLifecycleInstrumentedTest#slotVariableWritesAreIsolated' > liveprog-instrumentation.log 2>&1
            status=$?
            kill $logcat_pid 2>/dev/null || true
            wait $logcat_pid 2>/dev/null || true
            cat liveprog-instrumentation.log
            adb logcat -b crash -d > liveprog-crash-buffer.txt || true
            adb shell ls -la /data/tombstones > liveprog-tombstones-list.txt 2>&1 || true
            exit $status

      - name: Upload LiveProg emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liveprog-emulator-diagnostics
          if-no-files-found: warn
          path: |
            liveprog-instrumentation.log
            liveprog-logcat.txt
            emulator-props.txt
            liveprog-crash-buffer.txt
            liveprog-tombstones-list.txt
            app/build/outputs/androidTest-results/**
