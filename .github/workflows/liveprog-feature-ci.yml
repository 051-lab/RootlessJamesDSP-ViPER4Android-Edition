name: LiveProg feature CI

on:
  push:
    branches:
      - feature/liveprog-slider-block
  workflow_dispatch:

concurrency:
  group: liveprog-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build rootless F-Droid debug APK
        run: ./gradlew assembleRootlessFdroidDebug --no-daemon

      - name: Compile rootless F-Droid instrumentation APK
        run: ./gradlew assembleRootlessFdroidDebugAndroidTest --no-daemon

      - name: JVM tests
        run: ./gradlew testRootlessFdroidDebugUnitTest --no-daemon

      - name: Build rootless F-Droid release APK
        run: ./gradlew assembleRootlessFdroidRelease --no-daemon

  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Clean x86_64 API34 LiveProg validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb logcat -c || true
            adb logcat -v threadtime > liveprog-logcat.txt 2>&1 &
            logcat_pid=$!
            set +e
            ./gradlew connectedRootlessFdroidDebugAndroidTest --no-daemon --stacktrace --info '-Pandroid.testInstrumentationRunnerArguments.class=me.timschneeberger.rootlessjamesdsp.interop.LiveProgLifecycleInstrumentedTest#slotVariableWritesAreIsolated' > liveprog-isolated.log 2>&1
            isolated_status=$?
            cat liveprog-isolated.log
            if [ $isolated_status -ne 0 ]; then exit $isolated_status; fi
            ./gradlew connectedRootlessFdroidDebugAndroidTest --no-daemon --stacktrace --info '-Pandroid.testInstrumentationRunnerArguments.class=me.timschneeberger.rootlessjamesdsp.interop.LiveProgLifecycleInstrumentedTest' > liveprog-full-suite.log 2>&1
            full_status=$?
            kill $logcat_pid 2>/dev/null || true
            wait $logcat_pid 2>/dev/null || true
            cat liveprog-full-suite.log
            exit $full_status

      - name: Upload LiveProg emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liveprog-emulator-diagnostics
          if-no-files-found: warn
          path: |
            liveprog-isolated.log
            liveprog-full-suite.log
            liveprog-logcat.txt
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
