name: LiveProg feature CI

on:
  push:
    branches:
      - feature/liveprog-slider-block
  workflow_dispatch:

concurrency:
  group: liveprog-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM tests
        run: ./gradlew testRootlessFdroidDebugUnitTest --no-daemon

      - name: Build rootless F-Droid debug APK
        run: ./gradlew assembleRootlessFdroidDebug --no-daemon
