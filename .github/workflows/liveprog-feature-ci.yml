name: LiveProg feature CI

on:
  push:
    branches:
      - feature/liveprog-slider-block
  workflow_dispatch:

concurrency:
  group: liveprog-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build rootless F-Droid debug APK
        run: ./gradlew assembleRootlessFdroidDebug --no-daemon

      - name: Compile rootless F-Droid instrumentation APK
        run: ./gradlew assembleRootlessFdroidDebugAndroidTest --no-daemon

      - name: JVM tests
        run: ./gradlew testRootlessFdroidDebugUnitTest --no-daemon

      - name: Build rootless F-Droid release APK
        run: ./gradlew assembleRootlessFdroidRelease --no-daemon

  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run LiveProg instrumentation tests on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: ./gradlew connectedRootlessFdroidDebugAndroidTest --no-daemon
