name: Build fork APK
on:
  push:
    branches: [ master, viper-extras ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: adopt
      - name: Run JVM tests
        run: ./gradlew testRootlessFdroidDebugUnitTest --no-daemon
      - name: Build rootless preview APK (FOSS, debug-signed)
        run: ./gradlew assembleRootlessFdroidDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RootlessViPER4Android-preview
          path: app/build/outputs/apk/rootlessFdroid/debug/*.apk
